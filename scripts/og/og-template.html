<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      body {
        position: relative;
        background: #0b0b0c;
        overflow: hidden;
        font-family: 'Inter', system-ui, sans-serif;
        color: #fafafa;
      }
      /* faint grid, masked to fade toward the bottom */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 64px 64px;
        -webkit-mask-image: radial-gradient(130% 90% at 20% 0%, #000 35%, transparent 82%);
        mask-image: radial-gradient(130% 90% at 20% 0%, #000 35%, transparent 82%);
      }
      /* silk glow top-right — teal to violet */
      .glow {
        position: absolute;
        top: -220px;
        right: -160px;
        width: 720px;
        height: 720px;
        background:
          radial-gradient(closest-side, rgba(45, 212, 191, 0.28), transparent 70%),
          radial-gradient(closest-side, rgba(139, 92, 246, 0.16), transparent 72%);
        filter: blur(8px);
      }
      .frame {
        position: absolute;
        inset: 0;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .mark {
        position: relative;
        width: 76px;
        height: 76px;
        border-radius: 18px;
        overflow: hidden;
      }
      /* logo-on-dark.svg = transparent canvas, teal tile + dark arrow, tile fills
         the middle 60% of a 1500 viewBox. Scale up + center so the tile fills the
         76px mark and the transparent padding is cropped away. */
      .mark img {
        position: absolute;
        width: 127px;
        height: 127px;
        left: -25.5px;
        top: -25.5px;
      }
      .brand .word {
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 40px;
        letter-spacing: -0.01em;
      }
      .headline {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 500;
        font-size: 92px;
        line-height: 1.0;
        letter-spacing: -0.02em;
        max-width: 15ch;
      }
      .headline .accent {
        color: #2dd4bf;
      }
      .foot {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .caps {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 400;
        font-size: 24px;
        letter-spacing: 0.01em;
        color: #a1a1a5;
      }
      .caps .dot {
        color: #5eead4;
        margin: 0 10px;
      }
      .url {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 26px;
        color: #2dd4bf;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="frame">
      <div class="brand">
        <div class="mark">
          <img src="../../public/logo-on-dark.svg" alt="" />
        </div>
        <div class="word">Naazware</div>
      </div>

      <div class="headline">
        Custom software,<br />
        <span class="accent">crafted to fit.</span>
      </div>

      <div class="foot">
        <div class="caps">
          Websites<span class="dot">·</span>Web &amp; mobile apps<span class="dot">·</span>Branding<span class="dot">·</span>Care &amp; hosting
        </div>
        <div class="url">naazware.com</div>
      </div>
    </div>
  </body>
</html>
